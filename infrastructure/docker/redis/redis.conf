# Aether Redis Configuration
# Persistence: Append-Only File for durability
appendonly yes
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Memory management
maxmemory 512mb
maxmemory-policy allkeys-lru

# Security: local access only
bind 127.0.0.1
protected-mode yes

# No password for local development (single-machine, not exposed)
# requirepass "" is implicit

# Logging
loglevel notice
logfile ""

# Save snapshots as backup (in addition to AOF)
save 900 1
save 300 10
save 60 10000
