[project]
name = "aether-os"
version = "0.1.0"
description = "Aether AI OS — Personal AI Operating System"
requires-python = ">=3.12"
dependencies = [
    # Core framework
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "structlog>=24.4,<25",
    "uuid-utils>=0.9,<1",
    # LLM routing (model-agnostic)
    "litellm>=1.49,<2",
    # Database
    "sqlalchemy[asyncio]>=2.0,<3",
    "aiosqlite>=0.20,<1",
    "asyncpg>=0.29,<1",
    "alembic>=1.13,<2",
    # Vector store
    "qdrant-client>=1.11,<2",
    # Message bus
    "redis[hiredis]>=5.1,<6",
    # Embeddings (local, no API cost)
    "sentence-transformers>=3.1,<4",
    # HTTP server and client
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.31,<1",
    "httpx>=0.27,<1",
    # Web search (no API key)
    "duckduckgo-search>=6.0,<7",
    # File operations
    "aiofiles>=23.0,<25",
    # Rich CLI output
    "rich>=13.0,<14",
    "torchaudio>=2.11.0",
]

[project.optional-dependencies]
voice = [
    "faster-whisper>=1.0,<2",
    "sounddevice>=0.5,<1",
    "pvporcupine>=3.0,<4",
    "numpy>=1.26,<3",
    "torch>=2.0,<3",
    "kokoro>=0.7,<1",
    "soundfile>=0.12,<1",
]

[project.scripts]
aether = "aether.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The build backend (DEBT-019). Without a [build-system] table, uv did not
# recognise the project as installable and silently dropped the editable
# `aether-os` install on every `uv sync`, breaking `uv run` immediately after —
# worked around by hand three times across this remediation arc before being
# fixed here. Explicit package list because this is a FLAT layout with two
# top-level packages (`aether`, `services`), neither of which matches the
# distribution name `aether-os`, so hatchling's name-based auto-detection cannot
# find them. (Replaces the former `[tool.setuptools.packages.find]`, which had
# no build-system to activate it and was therefore inert.)
[tool.hatch.build.targets.wheel]
packages = ["aether", "services"]

# Dev dependencies in PEP 735 form (D-001). Migrated from the deprecated
# `[tool.uv] dev-dependencies`, which uv 0.11+ warns on and will remove.
# Same packages, same constraints — a syntax migration only; uv installs the
# `dev` group by default, so `uv sync` / `uv run` behave identically.
[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.23,<1",
    "pytest-cov>=5.0,<6",
    "ruff>=0.6,<1",
    "mypy>=1.11,<2",
    "import-linter>=2.0,<3",
    "pre-commit>=3.8,<4",
    "aiofiles>=23.0,<25",
]

# PyTorch CUDA 12.x build (M2.1.10 / DEBT-013).
#
# Without this, `torch` resolves from PyPI, whose default Windows wheel is the
# CPU-ONLY build (torch==X.Y.Z+cpu, torch.cuda.is_available() == False). A
# .venv rebuild silently did exactly that, which left faster-whisper unable to
# load cublas64_12.dll and took the entire voice pipeline offline while every
# dependency still "resolved successfully" — a failure with no loud symptom
# until STT is actually invoked.
#
# cu126 is the CUDA 12.x index, matching AETHER_V1_TECHNICAL_SPECIFICATION.md
# Section 12's "CUDA Toolkit 12.x" requirement. It is also the only 12.x index
# publishing torch 2.12.x / torchaudio 2.11.x for cp312 on win_amd64 (verified
# against the index directly: cu121/cu124/cu128/cu129 do not). CUDA 12.6 wheels
# are forward-compatible with the installed 13.3 driver.
#
# `explicit = true` confines this index to the packages mapped below, so no
# other dependency is silently resolved from it.
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchaudio = { index = "pytorch-cu126" }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "A",   # flake8-builtins
    "C4",  # flake8-comprehensions
    "PT",  # flake8-pytest-style
    "SIM", # flake8-simplify
    "C901", # mccabe complexity
]
ignore = ["E501"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_any_generics = true
ignore_missing_imports = false

# Third-party audio/voice libraries that ship neither type stubs nor a py.typed
# marker, so --strict cannot analyze them. Scoped per-module (M2.1.9 / DEBT-005)
# so the strict global `ignore_missing_imports = false` above still governs
# every other import in the tree.
[[tool.mypy.overrides]]
module = [
    "pvporcupine.*",
    "sounddevice.*",
    "kokoro.*",
    "faster_whisper.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--tb=short"

[tool.importlinter]
root_packages = ["aether", "services"]
include_external_packages = true

# M2.1.5: allow_indirect_imports = true on both boundary contracts. The
# Constitution (ARCHITECTURE_RULES Rules 1-2) forbids DIRECT imports of the
# private submodules / DB clients / provider SDKs; reaching them transitively
# through the public MemoryAPI / LLMRouter facades IS the sanctioned
# architecture. Chain-following made every legal consumer of MemoryAPI a
# false positive (e.g. session -> memory.api -> _stores -> qdrant_client).
[[tool.importlinter.contracts]]
name = "Memory module boundary: no external DB access"
type = "forbidden"
allow_indirect_imports = true
# aether.tasks is deliberately NOT a source module of this contract (DEBT-017).
# TaskManager (aether/tasks/manager.py) imports SQLAlchemy directly, by design:
# Tasks are a separate domain, not a form of memory — they are actionable to-do
# items, not recalled facts, and only share the physical database as
# infrastructure. Aether's principle is "each domain has exactly one gatekeeper,"
# not "only one module may touch SQL anywhere," so the Tasks domain owns its own
# DB access just as Memory's _stores/ does for its domain. Do not add
# "aether.tasks" here without amending that decision. See aether/tasks/manager.py
# and V1_TECHNICAL_SPECIFICATION.md Section 2.9.
source_modules = [
    "aether.agents",
    "aether.session",
    "aether.interfaces",
]
forbidden_modules = [
    "aether.memory._stores",
    "aether.memory._retrieval",
    "aether.memory._consolidation",
    "qdrant_client",
    "sqlalchemy",
    "aiosqlite",
]

[[tool.importlinter.contracts]]
name = "LLM boundary: no direct provider access"
type = "forbidden"
allow_indirect_imports = true
source_modules = [
    "aether.agents",
    "aether.memory",
    "aether.tools",
    "aether.tasks",
    "aether.session",
    "aether.interfaces",
]
forbidden_modules = [
    "aether.llm._providers",
    "anthropic",
    "openai",
    "litellm",
    "google",
]

[[tool.importlinter.contracts]]
name = "Services boundary: voice service cannot import from aether internals"
type = "forbidden"
source_modules = ["services.voice"]
forbidden_modules = [
    "aether.memory._stores",
    "aether.llm._providers",
    "qdrant_client",
    "sqlalchemy",
]
