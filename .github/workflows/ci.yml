name: Aether CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv run ruff check .

  format:
    name: Format (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv run ruff format --check .

  type-check:
    name: Type Check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync
      - run: uv run mypy aether/ services/ --strict

  architecture:
    name: Architecture Boundaries (import-linter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync
      - run: uv run lint-imports

  security-scan:
    name: Forbidden Pattern Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Scoped per DEBT-015. The original single grep conflated three different
      # rules over one path list, so it flagged code the architecture mandates:
      # Alembic downgrade() DROP TABLE, and the litellm import that IS the
      # approved provider abstraction. Each rule now carries its own scope; none
      # is weakened — every pattern is still forbidden everywhere it was
      # genuinely forbidden before.
      - name: Destructive operations in application code
        run: |
          if grep -rn "DROP TABLE\|TRUNCATE\|rm -rf\|flushall\|drop_all" \
            aether/ services/ --include="*.py"; then
            echo "::error::Destructive operation found in application code (ADR-010 Section 3)"
            exit 1
          fi
          echo "OK: no destructive operations in aether/ or services/"
      - name: Destructive operations in migrations
        run: |
          # Alembic downgrade() legitimately drops what upgrade() created, so
          # DROP TABLE / TRUNCATE are expected here and only here. Every other
          # destructive pattern remains forbidden in migrations too.
          if grep -rn "rm -rf\|flushall\|drop_all" \
            migrations/ --include="*.py"; then
            echo "::error::Destructive operation found in migrations/ (ADR-010 Section 3)"
            exit 1
          fi
          echo "OK: no forbidden destructive operations in migrations/"
      - name: LLM provider SDKs imported outside the provider layer
        run: |
          # ARCHITECTURE_RULES Rule 2: provider SDKs may be imported ONLY inside
          # aether/llm/_providers/ — that wrapper is the model-agnostic
          # abstraction. Anywhere else is a boundary violation.
          if grep -rn "import anthropic\|import openai\|import litellm\|import google.generativeai" \
            aether/ services/ --include="*.py" \
            | grep -v "^aether/llm/_providers/"; then
            echo "::error::LLM provider SDK imported outside aether/llm/_providers/"
            exit 1
          fi
          echo "OK: provider SDKs confined to aether/llm/_providers/"

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync
      - run: uv run pytest tests/unit/ tests/contracts/ tests/architecture/ -v --tb=short
        env:
          # These paths are pure unit tests and never open a database
          # connection. But the session-scoped, autouse DB-safety guard
          # (M2.1.7, tests/conftest_db_guard.py) refuses to run the whole
          # session unless a test-marked database URL is configured — and
          # config/local.yaml, which sets it locally, is gitignored, so it is
          # absent on CI (database.test_url defaults to "", which the guard
          # rejects). Supplying a test-marked URL satisfies the guard's string
          # check; nothing dials it, because no test in these paths connects.
          AETHER_TEST_DATABASE_URL: "postgresql+asyncpg://aether:test@localhost:5432/aether_test"
          # .aether/permissions.yaml expands ${USERPROFILE} in its path lists;
          # the Linux runner has no USERPROFILE, so the loader would reject the
          # unresolved variable and every SafetyValidator(real permissions) test
          # would fail. /home/runner is the runner's real home; the Documents
          # subpaths need not exist because these tests check allow/deny logic,
          # not filesystem I/O.
          USERPROFILE: /home/runner
